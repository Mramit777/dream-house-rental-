<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dream House Rental</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:bold}
nav{display:flex;gap:15px}
nav a{text-decoration:none;color:#333;font-weight:bold}
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:50px 20px}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{margin-bottom:22px}
.container{width:94%;max-width:1100px;margin:25px auto}
.section-title{text-align:center;margin:25px 0 18px}
.box{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{font-weight:bold;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:100px}
button{border:0;border-radius:7px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer}
.green{background:#198754;color:#fff}
.red{background:#dc3545;color:#fff}
.blue{background:#0d6efd;color:#fff}
.white{background:#fff;color:#333}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
#status{display:none;margin-top:12px;padding:10px;border-radius:7px}
.search{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.count{font-weight:bold;margin:15px 0}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:200px;object-fit:cover}
.cardbody{padding:15px}
.card h3{margin-bottom:8px}
.rent{font-size:21px;font-weight:bold;color:#198754;margin-bottom:10px}
.info{margin:6px 0;line-height:1.4}
.desc{margin-top:10px;color:#555}
.cardbuttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}
.cardbuttons button{flex:1}
.empty{text-align:center;background:#fff;padding:30px;border-radius:10px;grid-column:1/-1}
.preview{display:none;width:250px;max-height:200px;object-fit:cover;margin-top:10px;border-radius:8px}
footer{margin-top:40px;background:#222;color:#fff;text-align:center;padding:25px}

@media(max-width:800px){
.rooms{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
header{padding:13px 4%}
.logo{font-size:17px}
nav{gap:8px}
nav a{font-size:13px}
.grid,.search{grid-template-columns:1fr}
.full{grid-column:auto}
.rooms{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">🏠 Dream House Rental</div>
<nav>
<a href="#home">Home</a>
<a href="#post">Post Room</a>
<a href="#rooms">Rooms</a>
</nav>
</header>

<section class="hero" id="home">
<h1>🏠 Dream House Rental</h1>
<p>Room, Flat, House, PG और Shop आसानी से खोजें</p>
<a href="#post"><button class="white">Post Your Room</button></a>
</section>

<div class="container">

<section id="post">
<h2 class="section-title">Post Your Room</h2>

<div class="box">

<div class="grid">

<div>
<label>Owner Name *</label>
<input id="name" placeholder="Owner का नाम">
</div>

<div>
<label>Mobile Number *</label>
<input id="mobile" type="tel" placeholder="10 digit mobile number">
</div>

<div>
<label>City *</label>
<input id="city" placeholder="जैसे Indore">
</div>

<div>
<label>Property Type *</label>
<select id="type">
<option value="">Select Type</option>
<option>Room</option>
<option>1 BHK</option>
<option>2 BHK</option>
<option>3 BHK</option>
<option>Flat</option>
<option>House</option>
<option>PG</option>
<option>Shop</option>
</select>
</div>

<div>
<label>Furnishing</label>
<select id="furnishing">
<option value="">Select Furnishing</option>
<option>Unfurnished</option>
<option>Semi Furnished</option>
<option>Fully Furnished</option>
</select>
</div>

<div>
<label>Monthly Rent (₹) *</label>
<input id="rent" type="number" placeholder="जैसे 7000">
</div>

<div class="full">
<label>Full Address *</label>
<input id="address" placeholder="पूरा पता">
</div>

<div class="full">
<label>Room Photo</label>
<input id="image" type="file" accept="image/*">
<img id="preview" class="preview">
</div>

<div class="full">
<label>Description</label>
<textarea id="description" placeholder="Room की जानकारी"></textarea>
</div>

</div>

<div class="buttons">
<button id="save" class="green">Post Room</button>
<button id="cancel" class="red" style="display:none">Cancel Edit</button>
</div>

<div id="status"></div>

</div>
</section>


<section id="rooms">
<h2 class="section-title">Available Rooms</h2>

<div class="box">
<div class="search">
<input id="search" placeholder="🔍 City या address search करें">
<select id="filter">
<option value="">All Types</option>
<option>Room</option>
<option>1 BHK</option>
<option>2 BHK</option>
<option>3 BHK</option>
<option>Flat</option>
<option>House</option>
<option>PG</option>
<option>Shop</option>
</select>
</div>
</div>

<div id="count" class="count">Rooms load हो रहे हैं...</div>

<div id="roomsList" class="rooms">
<div class="empty">Loading...</div>
</div>

</section>
</div>

<footer>
© 2026 Dream House Rental
</footer>


<script>

const PROJECT="dream-house-rental";
const DATABASE="(default)";
const COLLECTION="room";

const APIKEY="AIzaSyCmMXxjiy4bSle5KdAza8dOiBKNtEwLdb0";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/${DATABASE}/documents/${COLLECTION}`;

const FALLBACK=
"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=80";

let allRooms=[];
let editId=null;
let photoData="";


const $=id=>document.getElementById(id);

function status(msg,error=false){
$("status").style.display="block";
$("status").textContent=msg;
$("status").style.background=error?"#f8d7da":"#d1e7dd";
$("status").style.color=error?"#842029":"#0f5132";
}


function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


function firestoreFields(data){

return {
name:{stringValue:data.name||""},
mobile:{stringValue:data.mobile||""},
city:{stringValue:data.city||""},
address:{stringValue:data.address||""},
type:{stringValue:data.type||""},
furnishing:{stringValue:data.furnishing||""},
rent:{stringValue:String(data.rent||"")},
image:{stringValue:data.image||""},
description:{stringValue:data.description||""}
};

}


function normalData(fields){

return {
name:fields.name?.stringValue||"",
mobile:fields.mobile?.stringValue||"",
city:fields.city?.stringValue||"",
address:fields.address?.stringValue||"",
type:fields.type?.stringValue||"",
furnishing:fields.furnishing?.stringValue||"",
rent:fields.rent?.stringValue||"",
image:fields.image?.stringValue||"",
description:fields.description?.stringValue||""
};

}


async function loadRooms(){

$("roomsList").innerHTML=
'<div class="empty">Firebase से rooms load हो रहे हैं...</div>';

try{

const response=await fetch(
BASE+"?key="+encodeURIComponent(APIKEY)
);

const data=await response.json();

if(!response.ok){
throw new Error(data.error?.message||"Firebase read error");
}

allRooms=(data.documents||[]).map(d=>({

id:d.name.split("/").pop(),
...normalData(d.fields||{})

}));

display();

}catch(e){

console.error(e);

$("roomsList").innerHTML=`
<div class="empty">
<h3>Firebase से data नहीं आया</h3>
<p>${esc(e.message)}</p>
<br>
<button class="blue" onclick="loadRooms()">Retry</button>
</div>`;

$("count").textContent="";

}

}


function display(){

const q=$("search").value.trim().toLowerCase();
const type=$("filter").value;

const rooms=allRooms.filter(r=>{

const text=
(r.city+" "+r.address+" "+r.name).toLowerCase();

return (!q||text.includes(q)) &&
(!type||r.type===type);

});

$("count").textContent=
"कुल "+rooms.length+" room मिले";

if(!rooms.length){

$("roomsList").innerHTML=`
<div class="empty">
<h3>कोई room नहीं मिला</h3>
<p>Search बदलकर फिर कोशिश करें।</p>
</div>`;

return;
}


$("roomsList").innerHTML=rooms.map(r=>`

<div class="card">

<img src="${esc(r.image||FALLBACK)}"
onerror="this.src='${FALLBACK}'">

<div class="cardbody">

<h3>${esc(r.type||"Property")}</h3>

<div class="rent">
₹${Number(r.rent||0).toLocaleString("en-IN")}/month
</div>

<div class="info">👤 <b>Owner:</b> ${esc(r.name)}</div>
<div class="info">📱 <b>Mobile:</b> ${esc(r.mobile)}</div>
<div class="info">📍 <b>City:</b> ${esc(r.city)}</div>
<div class="info">🏠 <b>Address:</b> ${esc(r.address)}</div>
<div class="info">🛋️ <b>Furnishing:</b> ${esc(r.furnishing||"-")}</div>

${r.description?
`<div class="desc">${esc(r.description)}</div>`:""}

<div class="cardbuttons">

<button class="green"
onclick="contact('${esc(r.mobile)}')">
📞 Contact
</button>

<button class="blue"
onclick="editRoom('${esc(r.id)}')">
✏️ Edit
</button>

<button class="red"
onclick="deleteRoom('${esc(r.id)}')">
🗑️ Delete
</button>

</div>

</div>
</div>

`).join("");

}


function getData(){

return {
name:$("name").value.trim(),
mobile:$("mobile").value.trim(),
city:$("city").value.trim(),
address:$("address").value.trim(),
type:$("type").value,
furnishing:$("furnishing").value,
rent:$("rent").value,
image:photoData,
description:$("description").value.trim()
};

}


function validate(d){

if(!d.name)return "Owner Name डालें";
if(!/^[0-9]{10}$/.test(d.mobile))
return "Mobile Number 10 digit होना चाहिए";
if(!d.city)return "City डालें";
if(!d.address)return "Address डालें";
if(!d.type)return "Property Type select करें";
if(!d.rent||Number(d.rent)<=0)return "Rent डालें";

return "";

}


function compress(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

let w=img.width;
let h=img.height;
const max=700;

if(w>max||h>max){

if(w>h){
h=Math.round(h*max/w);
w=max;
}else{
w=Math.round(w*max/h);
h=max;
}

}

const c=document.createElement("canvas");
c.width=w;
c.height=h;

c.getContext("2d").drawImage(img,0,0,w,h);

let quality=.75;
let result=c.toDataURL("image/jpeg",quality);

while(result.length>450000&&quality>.35){
quality-=.05;
result=c.toDataURL("image/jpeg",quality);
}

resolve(result);

};

img.onerror=reject;
img.src=e.target.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});

}


$("image").addEventListener("change",async()=>{

const file=$("image").files[0];

if(!file)return;

try{

status("Photo compress हो रही है...");

photoData=await compress(file);

$("preview").src=photoData;
$("preview").style.display="block";

status("Photo तैयार है ✅");

}catch(e){

status("Photo load नहीं हुई",true);

}

});


$("save").addEventListener("click",async()=>{

const d=getData();
const error=validate(d);

if(error){
alert(error);
return;
}

$("save").disabled=true;

try{

const body={
fields:firestoreFields(d)
};

if(editId){

status("Room update हो रहा है...");

const response=await fetch(
BASE+"/"+encodeURIComponent(editId)+
"?key="+encodeURIComponent(APIKEY),
{
method:"PATCH",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
}
);

const result=await response.json();

if(!response.ok)
throw new Error(result.error?.message||"Update failed");

status("Room update हो गया ✅");

}else{

status("Room Firebase में save हो रहा है...");

const response=await fetch(
BASE+"?key="+encodeURIComponent(APIKEY),
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
}
);

const result=await response.json();

if(!response.ok)
throw new Error(result.error?.message||"Save failed");

status("Room successfully post हो गया ✅");

}

reset();
await loadRooms();

}catch(e){

console.error(e);
status("Error: "+e.message,true);

}finally{

$("save").disabled=false;

}

});


window.deleteRoom=async function(id){

if(!confirm("क्या यह room delete करना है?"))return;

try{

status("Room delete हो रहा है...");

const response=await fetch(
BASE+"/"+encodeURIComponent(id)+
"?key="+encodeURIComponent(APIKEY),
{method:"DELETE"}
);

const result=await response.json().catch(()=>({}));

if(!response.ok)
throw new Error(result.error?.message||"Delete failed");

status("Room delete हो गया ✅");

await loadRooms();

}catch(e){

status("Delete नहीं हुआ: "+e.message,true);

}

};


window.editRoom=function(id){

const r=allRooms.find(x=>x.id===id);

if(!r){
alert("Room नहीं मिला");
return;
}

editId=id;

$("name").value=r.name;
$("mobile").value=r.mobile;
$("city").value=r.city;
$("address").value=r.address;
$("type").value=r.type;
$("furnishing").value=r.furnishing;
$("rent").value=r.rent;
$("description").value=r.description;

photoData=r.image||"";

if(photoData){
$("preview").src=photoData;
$("preview").style.display="block";
}else{
$("preview").style.display="none";
}

$("save").textContent="Update Room";
$("cancel").style.display="inline-block";

document.getElementById("post")
.scrollIntoView({behavior:"smooth"});

};


$("cancel").onclick=()=>{

reset();
status("Edit cancel कर दिया गया।");

};


function reset(){

editId=null;
photoData="";

$("name").value="";
$("mobile").value="";
$("city").value="";
$("address").value="";
$("type").value="";
$("furnishing").value="";
$("rent").value="";
$("description").value="";
$("image").value="";

$("preview").src="";
$("preview").style.display="none";

$("save").textContent="Post Room";
$("cancel").style.display="none";

}


window.contact=function(mobile){

if(!mobile){
alert("Mobile number नहीं है");
return;
}

if(confirm("क्या owner को call करना है?\n\n"+mobile)){
location.href="tel:"+mobile;
}

};


$("search").addEventListener("input",display);
$("filter").addEventListener("change",display);

loadRooms();

</script>

</body>
</html>
