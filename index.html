<script type="module">


/* =========================

import {

}
from

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCmMXxjiy4bSle5KdAza8dOiBKNtEwLdb0",

  authDomain:
  "dream-house-rental.firebaseapp.com",

  projectId:
  "dream-house-rental",

  storageBucket:
  "dream-house-rental.firebasestorage.app",

  messagingSenderId:
  "1032087331224",

  appId:
  "1:1032087331224:web:dd7d89de72cd111fcb4bed",

  measurementId:
  "G-06LZEPB9NY"

};



/* =========================
   FIREBASE START
========================= */

const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app, "default");


const roomCollection =
  collection(db, "room");



/* =========================
   ELEMENTS
========================= */

const firebaseStatus =
  document.getElementById(
    "firebaseStatus"
  );


const roomsContainer =
  document.getElementById(
    "roomsContainer"
  );


const roomCount =
  document.getElementById(
    "roomCount"
  );



let allRooms = [];

let editingId = null;

let currentPhotoData = "";



/* =========================
   FIREBASE STATUS
========================= */

firebaseStatus.textContent =
  "✅ Firebase connected successfully";



/* =========================
   IMAGE COMPRESS
========================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    if(!file){

      resolve("");

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
    function(e){

      const img =
        new Image();


      img.onload =
      function(){

        let maxSide = 900;

        let width =
          img.width;

        let height =
          img.height;


        if(width > height){

          if(width > maxSide){

            height =
              Math.round(
                height *
                maxSide /
                width
              );

            width =
              maxSide;
          }

        }else{

          if(height > maxSide){

            width =
              Math.round(
                width *
                maxSide /
                height
              );

            height =
              maxSide;
          }

        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;

        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        const data =
          canvas.toDataURL(
            "image/jpeg",
            0.75
          );


        resolve(data);

      };


      img.onerror =
        reject;


      img.src =
        e.target.result;

    };


    reader.onerror =
      reject;


    reader.readAsDataURL(file);

  });

}



/* =========================
   PHOTO SELECT
========================= */

document
.getElementById("image")
.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    if(!file){

      return;
    }


    try{

      currentPhotoData =
        await compressImage(file);


      const preview =
        document.getElementById(
          "photoPreview"
        );


      preview.src =
        currentPhotoData;


      preview.style.display =
        "block";


    }catch(error){

      console.error(error);

      alert(
        "❌ Photo load nahi hui."
      );

    }

  }
);



/* =========================
   LOAD ROOMS
========================= */

async function loadRooms(){

  roomsContainer.innerHTML =
    '<div class="loading">🔄 Loading rooms...</div>';


  try{

    const snapshot =
      await getDocs(
        roomCollection
      );


    allRooms = [];


    snapshot.forEach(
      (item)=>{

        allRooms.push({

          id:item.id,

          ...item.data()

        });

      }
    );


    console.log(
      "Firestore rooms:",
      allRooms.length
    );


    displayRooms(
      allRooms
    );


  }catch(error){

    console.error(error);


    roomsContainer.innerHTML = `

      <div class="no-room">

        ❌ Rooms load nahi ho rahe.

        <br><br>

        <b>Error:</b>

        ${error.code || ""}

        <br>

        ${error.message || ""}

      </div>

    `;


    roomCount.textContent =
      "❌ Firebase error";

  }

}



/* =========================
   DISPLAY ROOMS
========================= */

function displayRooms(rooms){

  roomCount.textContent =
    "कुल " +
    rooms.length +
    " room मिले";


  if(rooms.length === 0){

    roomsContainer.innerHTML = `

      <div class="no-room">

        🏠 कोई room नहीं मिला

        <br><br>

        Search बदलकर फिर कोशिश करें।

      </div>

    `;

    return;
  }


  roomsContainer.innerHTML =
    "";


  rooms.forEach(
    (room)=>{

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "room-card";


      let imageHTML =
        "";


      if(room.image){

        imageHTML = `

          <img
            src="${room.image}"
            alt="Room Photo">

        `;

      }


      const safeName =
        room.name ||
        "Owner";


      const safeCity =
        room.city ||
        "";


      const safeAddress =
        room.address ||
        "";


      const safeType =
        room.type ||
        "";


      const safeFurnishing =
        room.furnishing ||
        "";


      const safeRent =
        room.rent ||
        "";


      const safeDescription =
        room.description ||
        "";


      const mobile =
        String(
          room.mobile || ""
        ).replace(
          /\D/g,
          ""
        );


      card.innerHTML = `

        ${imageHTML}


        <div class="room-info">


          <h3>
            🏠 ${safeType || "Property"}
          </h3>


          <p class="rent">
            💰 ₹${safeRent} / Month
          </p>


          <p>
            📍 <b>City:</b>
            ${safeCity}
          </p>


          <p>
            🏠 <b>Address:</b>
            ${safeAddress || "Not specified"}
          </p>


          <p>
            🛋️ <b>Furnishing:</b>
            ${safeFurnishing || "Not specified"}
          </p>


          <div class="owner-box">


            <p>
              👤 <b>Owner:</b>
              ${safeName}
            </p>


            <p>
              📞 <b>Mobile:</b>
              ${room.mobile || ""}
            </p>


          </div>


          <p>
            📝 ${safeDescription || "No description"}
          </p>


          <div class="action-buttons">


            <button
              class="call"
              onclick="contactOwner('${mobile}')">

              📞 Call

            </button>


            <button
              class="whatsapp"
              onclick="whatsappOwner('${mobile}','${safeName}')">

              💬 WhatsApp

            </button>


            <button
              class="edit"
              onclick="editRoom('${room.id}')">

              ✏️ Edit

            </button>


            <button
              class="delete"
              onclick="deleteRoom('${room.id}')">

              🗑️ Delete

            </button>


          </div>


        </div>

      `;


      roomsContainer.appendChild(
        card
      );

    }
  );

}



/* =========================
   SEARCH
========================= */

window.searchRooms =
function(){

  const city =
    document
    .getElementById(
      "searchCity"
    )
    .value
    .trim()
    .toLowerCase();


  const type =
    document
    .getElementById(
      "searchType"
    )
    .value
    .trim()
    .toLowerCase();


  const maxRentValue =
    document
    .getElementById(
      "searchMaxRent"
    )
    .value
    .trim();


  const maxRent =
    maxRentValue
    ? Number(maxRentValue)
    : Infinity;


  const filtered =
    allRooms.filter(
      (room)=>{

        const roomCity =
          String(
            room.city || ""
          )
          .toLowerCase();


        const roomType =
          String(
            room.type || ""
          )
          .toLowerCase();


        const roomRent =
          Number(
            room.rent || 0
          );


        const cityOK =
          !city ||
          roomCity.includes(
            city
          );


        const typeOK =
          !type ||
          roomType === type;


        const rentOK =
          roomRent <= maxRent;


        return (
          cityOK &&
          typeOK &&
          rentOK
        );

      }
    );


  displayRooms(
    filtered
  );

};



/* =========================
   CLEAR SEARCH
========================= */

window.clearSearch =
function(){

  document
  .getElementById(
    "searchCity"
  )
  .value = "";


  document
  .getElementById(
    "searchType"
  )
  .value = "";


  document
  .getElementById(
    "searchMaxRent"
  )
  .value = "";


  displayRooms(
    allRooms
  );

};



/* =========================
   CALL OWNER
========================= */

window.contactOwner =
function(number){

  if(!number){

    alert(
      "Owner mobile number available nahi hai."
    );

    return;
  }


  let phone =
    String(number)
    .replace(
      /\D/g,
      ""
    );


  /*
     07772064727
          ↓
     7772064727
          ↓
     917772064727
  */


  if(phone.startsWith("0")){

    phone =
      phone.substring(1);

  }


  if(phone.length === 10){

    phone =
      "91" + phone;

  }


  if(
    phone.length !== 12 ||
    !phone.startsWith("91")
  ){

    alert(
      "❌ Mobile number galat hai.\n\n" +
      "Example: 7772064727"
    );

    return;
  }


  const displayNumber =
    phone.substring(2);


  const ok =
    confirm(
      "Owner ko call karna hai?\n\n" +
      "+91 " +
      displayNumber
    );


  if(ok){

    window.location.href =
      "tel:+" + phone;

  }

};



/* =========================
   WHATSAPP OWNER
========================= */

window.whatsappOwner =
function(number,name){

  if(!number){

    alert(
      "Owner mobile number available nahi hai."
    );

    return;
  }


  let phone =
    String(number)
    .replace(
      /\D/g,
      ""
    );


  /*
     07772064727
          ↓
     7772064727
          ↓
     917772064727
  */


  if(phone.startsWith("0")){

    phone =
      phone.substring(1);

  }


  if(phone.length === 10){

    phone =
      "91" + phone;

  }


  if(
    phone.length !== 12 ||
    !phone.startsWith("91")
  ){

    alert(
      "❌ WhatsApp number galat hai.\n\n" +
      "Example: 7772064727"
    );

    return;
  }


  const message =
    "Hello " +
    (name || "Owner") +
    ", I found your property on Dream House Rental. I am interested in this property.";


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

};



/* =========================
   POST ROOM
========================= */

document
.getElementById("roomForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const button =
      document.getElementById(
        "postButton"
      );


    button.disabled =
      true;


    const wasEditing =
      !!editingId;


    button.textContent =
      wasEditing
      ? "Updating..."
      : "Saving...";


    try{

      const data = {

        name:
          document
          .getElementById("name")
          .value
          .trim(),


        mobile:
          document
          .getElementById("mobile")
          .value
          .trim(),


        city:
          document
          .getElementById("city")
          .value
          .trim(),


        address:
          document
          .getElementById("address")
          .value
          .trim(),


        type:
          document
          .getElementById("type")
          .value,


        furnishing:
          document
          .getElementById("furnishing")
          .value,


        rent:
          document
          .getElementById("rent")
          .value,


        description:
          document
          .getElementById("description")
          .value
          .trim(),


        updatedAt:
          serverTimestamp()

      };


      if(currentPhotoData){

        data.image =
          currentPhotoData;

      }


      if(editingId){

        await updateDoc(

          doc(
            db,
            "room",
            editingId
          ),

          data

        );


        alert(
          "✅ Room successfully updated."
        );


      }else{

        data.createdAt =
          serverTimestamp();


        await addDoc(

          roomCollection,

          data

        );


        alert(
          "✅ Room successfully posted."
        );

      }


      resetForm();


      await loadRooms();


      document
      .getElementById(
        "rooms"
      )
      .scrollIntoView({
        behavior:"smooth"
      });


    }catch(error){

      console.error(error);


      alert(
        "❌ Save nahi hua.\n\n" +
        (error.message || error)
      );

    }


    button.disabled =
      false;


    button.textContent =
      "Post Room";

  }
);



/* =========================
   EDIT ROOM
========================= */

window.editRoom =
function(id){

  const room =
    allRooms.find(
      item =>
      item.id === id
    );


  if(!room){

    alert(
      "Room nahi mila."
    );

    return;
  }


  editingId =
    id;


  document
  .getElementById("name")
  .value =
    room.name || "";


  document
  .getElementById("mobile")
  .value =
    room.mobile || "";


  document
  .getElementById("city")
  .value =
    room.city || "";


  document
  .getElementById("address")
  .value =
    room.address || "";


  document
  .getElementById("type")
  .value =
    room.type || "";


  document
  .getElementById("furnishing")
  .value =
    room.furnishing || "";


  document
  .getElementById("rent")
  .value =
    room.rent || "";


  document
  .getElementById("description")
  .value =
    room.description || "";


  currentPhotoData =
    room.image || "";


  if(room.image){

    const preview =
      document
      .getElementById(
        "photoPreview"
      );


    preview.src =
      room.image;


    preview.style.display =
      "block";

  }


  document
  .getElementById(
    "postButton"
  )
  .textContent =
    "Update Room";


  document
  .getElementById(
    "cancelButton"
  )
  .style.display =
    "inline-block";


  document
  .getElementById(
    "post"
  )
  .scrollIntoView({
    behavior:"smooth"
  });

};



/* =========================
   DELETE ROOM
========================= */

window.deleteRoom =
async function(id){

  const ok =
    confirm(
      "Kya aap is room ko delete karna chahte hain?"
    );


  if(!ok){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "room",
        id
      )

    );


    alert(
      "✅ Room deleted."
    );


    await loadRooms();


  }catch(error){

    console.error(error);


    alert(
      "❌ Delete nahi hua.\n\n" +
      (error.message || error)
    );

  }

};



/* =========================
   RESET FORM
========================= */

function resetForm(){

  document
  .getElementById(
    "roomForm"
  )
  .reset();


  editingId =
    null;


  currentPhotoData =
    "";


  document
  .getElementById(
    "photoPreview"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "photoPreview"
  )
  .src =
    "";


  document
  .getElementById(
    "postButton"
  )
  .textContent =
    "Post Room";


  document
  .getElementById(
    "cancelButton"
  )
  .style.display =
    "none";

}



/* =========================
   CANCEL EDIT
========================= */

document
.getElementById(
  "cancelButton"
)
.addEventListener(
  "click",
  function(){

    resetForm();

  }
);



/* =========================
   START APP
========================= */

loadRooms();


</script>
