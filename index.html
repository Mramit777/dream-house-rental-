}

}

body{

}

.container{

.hero{

.hero h1{

.hero p{

.status{

.primary{

.description{

/* =========================

========================= */

const roomForm =
  document.getElementById("roomForm");

const nameInput =
  document.getElementById("name");

const mobileInput =
  document.getElementById("mobile");

const cityInput =
  document.getElementById("city");

const addressInput =
  document.getElementById("address");

const typeInput =
  document.getElementById("type");

const furnishingInput =
  document.getElementById("furnishing");

const rentInput =

const imageInput =

let allRooms = [];

/* =========================
   FALLBACK IMAGE
========================= */

const FALLBACK_IMAGE =
  "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=900&q=80";


/* =========================
   IMAGE COMPRESSION
========================= */

async function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = function(){

      const img =
        new Image();

      img.onload = function(){

        let maxSide = 700;

        let width =
          img.width;

        let height =
          img.height;

        if(width > height){

          if(width > maxSide){

            height =
              Math.round(
                height * maxSide / width
              );

            width =
              maxSide;
          }

        }else{

          if(height > maxSide){

            width =
              Math.round(
                width * maxSide / height
              );

            height =
              maxSide;
          }
        }

        const canvas =
          document.createElement("canvas");

        canvas.width =
          width;

        canvas.height =
          height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        let quality = 0.75;

        let data =
          canvas.toDataURL(
            "image/jpeg",
            quality
          );

        while(
          data.length > 350000 &&
          quality > 0.35
        ){

          quality -= 0.08;

          data =
            canvas.toDataURL(
              "image/jpeg",
              quality
            );
        }

        resolve(data);

      };

      img.onerror =
        () => reject(
          new Error("Image load failed")
        );

      img.src =
        reader.result;
    };

    reader.onerror =
      () => reject(
        new Error("File read failed")
      );

    reader.readAsDataURL(file);

  });

}


/* =========================
   PHOTO PREVIEW
========================= */

imageInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file){

      return;
    }

    try{

      saveStatus.style.display =
        "block";

      saveStatus.textContent =

      currentPhotoData =
        await compressImage(file);

      photoPreview.src =
        currentPhotoData;

      photoPreview.style.display =
        "block";

      saveStatus.style.display =
        "none";

    }catch(error){

      console.error(error);

      saveStatus.style.display =
        "block";

      saveStatus.className =
        "status error";

      saveStatus.textContent =
        "❌ Photo load nahi hui.";

    }

  }
);


/* =========================
   LOAD ROOMS
========================= */

async function loadRooms(){

  if(!db){

    return;
  }

  roomCount.textContent =
    "🔄 Rooms load ho rahe hain...";

  roomsContainer.innerHTML =
    '<div class="loading">🔄 Firebase se rooms load ho rahe hain...</div>';

  try{

    const snapshot =
      await getDocs(
        collection(db,"room")
      );

    allRooms = [];

    snapshot.forEach(
      documentSnapshot => {

        allRooms.push({

          id:
            documentSnapshot.id,

          ...documentSnapshot.data()

        });

      }
    );

    allRooms.sort(
      (a,b)=>{

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );

    renderRooms();

  }catch(error){

    console.error(
      "Load rooms error:",
      error
    );

    roomCount.textContent =
      "❌ Firebase से data नहीं आया";

    roomsContainer.innerHTML = `

      <div class="empty">

        <h3>❌ Firebase से data नहीं आया</h3>

        <p style="margin-top:10px">
          ${escapeHtml(error.message)}
        </p>

        <button
          class="primary"
          onclick="location.reload()"
          style="margin-top:15px"
        >
          🔄 Retry
        </button>

      </div>

    `;

  }

}


/* =========================
   RENDER ROOMS
========================= */

function renderRooms(){

  const city =
    searchCity.value
      .trim()
      .toLowerCase();

  const type =
    searchType.value;

  const filtered =
    allRooms.filter(room=>{

      const roomCity =
        String(
          room.city || ""
        ).toLowerCase();

      const roomType =
        String(
          room.type || ""
        );

      const cityMatch =
        !city ||
        roomCity.includes(city);

      const typeMatch =
        !type ||
        roomType === type;

      return cityMatch &&
             typeMatch;

    });


  roomCount.textContent =
    `कुल ${filtered.length} room मिले`;


  if(filtered.length === 0){

    roomsContainer.innerHTML = `

      <div class="empty">

        <h3>🏠 कोई room नहीं मिला</h3>

        <p style="margin-top:8px">
          Search बदलकर फिर कोशिश करें।
        </p>

      </div>

    `;

    return;
  }


  roomsContainer.innerHTML =
    filtered.map(
      room => createRoomCard(room)
    ).join("");

}


/* =========================
   ROOM CARD
========================= */

function createRoomCard(room){

  const image =
    room.image ||
    FALLBACK_IMAGE;

  const name =
    room.name ||
    "Owner";

  const mobile =
    room.mobile ||
    "";

  const city =
    room.city ||
    "";

  const address =
    room.address ||
    "";

  const type =
    room.type ||
    "Room";

  const furnishing =
    room.furnishing ||
    "";

  const rent =
    room.rent ||
    "";

  const description =
    room.description ||
    "";

  const safeMobile =
    String(mobile)
      .replace(/[^\d+]/g,"");

  return `

    <article class="room">

      <img
        class="room-img"
        src="${escapeAttribute(image)}"
        onerror="this.src='${FALLBACK_IMAGE}'"
        alt="Room"
      >

      <div class="room-body">

        <div class="room-title">
          ${escapeHtml(type)}
        </div>

        <div class="rent">
          ₹${escapeHtml(String(rent))}
          / month
        </div>

        <div class="info">
          👤 <b>Owner:</b>
          ${escapeHtml(name)}
        </div>

        <div class="info">
          📍 <b>City:</b>
          ${escapeHtml(city)}
        </div>

        <div class="info">
          🏠 <b>Address:</b>
          ${escapeHtml(address)}
        </div>

        ${
          furnishing
          ?
          `<div class="info">
             🛋️ <b>Furnishing:</b>
             ${escapeHtml(furnishing)}
           </div>`
          :
          ""
        }

        ${
          description
          ?
          `<div class="description">
             ${escapeHtml(description)}
           </div>`
          :
          ""
        }

        <div class="room-buttons">

          ${
            safeMobile
            ?
            `<button
               class="success-btn"
               onclick="contactOwner('${escapeAttribute(safeMobile)}')"
             >
               📞 Contact Owner
             </button>`
            :
            ""
          }

          <button
            class="primary"
            onclick="editRoom('${escapeAttribute(room.id)}')"
          >
            ✏️ Edit
          </button>

          <button
            class="danger"
            onclick="deleteRoom('${escapeAttribute(room.id)}')"
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================
   CONTACT OWNER
========================= */

/* =========================
   ADD / UPDATE ROOM
========================= */

roomForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    if(!db){

      alert(
        "Firebase connect nahi hua."
      );

      return;
    }


    const name =
      nameInput.value.trim();

    const mobile =
      mobileInput.value.trim();

    const city =
      cityInput.value.trim();

    const address =
      addressInput.value.trim();

    const type =
      typeInput.value;

    const furnishing =
      furnishingInput.value;

    const rent =
      rentInput.value.trim();

    const description =
      descriptionInput.value.trim();


    if(
      !name ||
      !mobile ||
      !city ||
      !address ||
      !type ||
      !rent
    ){

      alert(
        "Please required fields bhariye."
      );

      return;
    }


    postButton.disabled =
      true;

    cancelButton.disabled =
      true;

    saveStatus.style.display =
      "block";

    saveStatus.className =
      "status";

    saveStatus.textContent =
      editingId
      ?
      "⏳ Room update ho raha hai..."
      :
      "⏳ Room Firestore में save हो रहा है...";


    try{

      const data = {

        name:
          name,

        mobile:
          mobile,

        city:
          city,

        address:
          address,

        type:
          type,

        furnishing:
          furnishing,

        rent:
          rent,

        description:
          description

      };


      if(currentPhotoData){

        data.image =
          currentPhotoData;

      }


      if(editingId){

        data.updatedAt =
          serverTimestamp();

        await updateDoc(
          doc(
            db,
            "room",
            editingId
          ),
          data
        );

        alert(
          "✅ Room successfully update ho gaya."
        );

      }else{

        data.createdAt =
          serverTimestamp();

        if(!data.image){

          data.image =
            "";
        }

        await addDoc(
          collection(db,"room"),
          data
        );

        alert(
          "✅ Room successfully post ho gaya."
        );

      }


      resetForm();

      await loadRooms();

      document
        .getElementById("rooms")
        .scrollIntoView({
          behavior:"smooth"
        });


    }catch(error){

      console.error(
        "Save error:",
        error
      );

      saveStatus.className =
        "status error";

      saveStatus.textContent =
        "❌ Save failed: " +
        error.message;

      alert(
        "❌ Firebase save error:\n\n" +
        error.message
      );

    }finally{

      postButton.disabled =
        false;

      cancelButton.disabled =
        false;

    }

  }
);


/* =========================
   EDIT ROOM
========================= */

window.editRoom =
function(id){

  const room =
    allRooms.find(
      item => item.id === id
    );

  if(!room){

    alert(
      "Room data nahi mila."
    );

    return;
  }


  editingId =
    id;


  nameInput.value =
    room.name || "";

  mobileInput.value =
    room.mobile || "";

  cityInput.value =
    room.city || "";

  addressInput.value =
    room.address || "";

  typeInput.value =
    room.type || "";

  furnishingInput.value =
    room.furnishing || "";

  rentInput.value =
    room.rent || "";

  descriptionInput.value =
    room.description || "";


  currentPhotoData =
    room.image || "";


  if(room.image){

    photoPreview.src =
      room.image;

    photoPreview.style.display =
      "block";

  }else{

    photoPreview.style.display =
      "none";

  }


  formTitle.textContent =
    "✏️ Edit Room";

  postButton.textContent =
    "Update Room";

  cancelButton.style.display =
    "inline-block";


  document
    .getElementById("post")
    .scrollIntoView({
      behavior:"smooth"
    });

};


/* =========================
   DELETE ROOM
========================= */

window.deleteRoom =
async function(id){

  const ok =
    confirm(
      "Kya aap ye room delete karna chahte hain?"
    );

  if(!ok){

    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "room",
        id
      )
    );

    alert(
      "✅ Room delete ho gaya."
    );

    await loadRooms();

  }catch(error){

    console.error(
      "Delete error:",
      error
    );

    alert(
      "❌ Delete failed:\n\n" +
      error.message
    );

  }

};

cancelButton.addEventListener(

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"&#039;")
    .replace(/"/g,"&quot;");

}
