<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream House Rental</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}

header{
  background:#ffffff;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:21px;
  font-weight:bold;
  color:#222;
}

nav{
  display:flex;
  gap:15px;
}

nav a{
  text-decoration:none;
  color:#333;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:34px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  margin-bottom:25px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:15px;
  font-weight:bold;

}

.btn-primary{
  background:#ffffff;
  color:#333;
}

.btn-green{

}

.btn-red{

  color:white;
}

.btn-blue{

}

.container{

}

  box-shadow:0 2px 10px rgba(0,0,0,.08);

.form-grid{

}

.form-group{

  flex-direction:column;
}

.form-group.full{

}

label{

}

input,

textarea{

  border:1px solid #ccc;

  font-size:15px;
  background:white;

textarea{

}

.photo-preview{

  max-height:250px;
  object-fit:cover;
  border-radius:8px;

}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  display:none;
  font-weight:bold;
}

.search-box{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.search-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
}

.room-count{
  margin:15px 0;
  font-weight:bold;
  font-size:17px;
}

.rooms{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.room-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.room-image{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
  background:#ddd;
}

.room-body{
  padding:16px;
}

.room-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.rent{
  font-size:21px;
  font-weight:bold;
  color:#198754;
  margin-bottom:10px;
}

.info{
  margin:6px 0;
  line-height:1.4;
}

.description{
  margin-top:10px;
  color:#555;
  line-height:1.45;
}

.card-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.card-buttons .btn{
  flex:1;
  min-width:100px;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:10px;
  grid-column:1/-1;
}

.loading{
  text-align:center;
  padding:25px;
  font-weight:bold;
}

footer{
  margin-top:40px;
  background:#222;
  color:white;
  text-align:center;
  padding:25px;
}

@media(max-width:800px){
  .rooms{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  header{
    padding:13px 4%;
  }

  .logo{
    font-size:18px;
  }

  nav{
    gap:8px;
  }

  nav a{
    font-size:13px;
  }

  .hero{
    padding:40px 15px;
  }

  .hero h1{
    font-size:28px;
  }

  .form-grid,
  .search-grid{
    grid-template-columns:1fr;
  }

  .rooms{
    grid-template-columns:1fr;
  }

  .room-image{
    height:220px;
  }

  .container{
    width:94%;
  }
}
</style>
</head>

</div>


<footer>
  <p>© 2026 Dream House Rental</p>
</footer>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCmMXxjiy4bSle5KdAza8dOiBKNtEwLdb0",
  authDomain: "dream-house-rental.firebaseapp.com",
  projectId: "dream-house-rental",
  storageBucket: "dream-house-rental.firebasestorage.app",
  messagingSenderId: "1032087331224",
  appId: "1:1032087331224:web:dd7d89de72cd111fcb4bed",
  measurementId: "G-06LZEPB9NY"
};


/* =========================
   FIREBASE START
========================= */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   COLLECTION
========================= */

const ROOM_COLLECTION = "room";


/* =========================
   VARIABLES
========================= */

let editingId = null;
let currentPhotoData = "";


/* =========================
   FALLBACK IMAGE
========================= */

const FALLBACK_IMAGE =
"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=80";


/* =========================
   ELEMENTS
========================= */

const nameInput = document.getElementById("name");
const mobileInput = document.getElementById("mobile");
const cityInput = document.getElementById("city");
const addressInput = document.getElementById("address");
const typeInput = document.getElementById("type");
const furnishingInput = document.getElementById("furnishing");
const rentInput = document.getElementById("rent");
const imageInput = document.getElementById("image");
const photoPreview = document.getElementById("photoPreview");
const descriptionInput = document.getElementById("description");

const postButton = document.getElementById("postButton");
const cancelButton = document.getElementById("cancelButton");

const roomsContainer = document.getElementById("roomsContainer");
const roomCount = document.getElementById("roomCount");

const searchCity = document.getElementById("searchCity");
const searchType = document.getElementById("searchType");

const statusBox = document.getElementById("status");


/* =========================
   STATUS
========================= */

function showStatus(message, type="success"){

  statusBox.style.display = "block";
  statusBox.textContent = message;

  if(type === "error"){
    statusBox.style.background = "#f8d7da";
    statusBox.style.color = "#842029";
  }
  else{
    statusBox.style.background = "#d1e7dd";
    statusBox.style.color = "#0f5132";
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   IMAGE COMPRESS
========================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = function(event){

      const img = new Image();

      img.onload = function(){

        let width = img.width;
        let height = img.height;

        const maxSide = 700;

        if(width > maxSide || height > maxSide){

          if(width > height){
            height = Math.round(height * maxSide / width);
            width = maxSide;
          }
          else{
            width = Math.round(width * maxSide / height);
            height = maxSide;
          }

        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        let quality = 0.75;

        let data = canvas.toDataURL("image/jpeg",quality);

        /*
          Try to keep image reasonably small
        */

        while(data.length > 400000 && quality > 0.35){

          quality -= 0.05;

          data = canvas.toDataURL(
            "image/jpeg",
            quality
          );

        }

        resolve(data);

      };

      img.onerror = function(){
        reject(new Error("Image load नहीं हुई"));
      };

      img.src = event.target.result;

    };

    reader.onerror = function(){
      reject(new Error("Image read नहीं हुई"));
    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   PHOTO SELECT
========================= */

imageInput.addEventListener("change", async function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  try{

    showStatus("Photo compress हो रही है...");

    currentPhotoData = await compressImage(file);

    photoPreview.src = currentPhotoData;
    photoPreview.style.display = "block";

    showStatus("Photo तैयार है ✅");

  }
  catch(error){

    console.error(error);

    showStatus(
      "Photo load नहीं हुई। दूसरी photo try करें।",
      "error"
    );

  }

});


/* =========================
   GET FORM DATA
========================= */

function getFormData(){

  return {

    name: nameInput.value.trim(),

    mobile: mobileInput.value.trim(),

    city: cityInput.value.trim(),

    address: addressInput.value.trim(),

    type: typeInput.value,

    furnishing: furnishingInput.value,

    rent: Number(rentInput.value),

    image: currentPhotoData || "",

    description: descriptionInput.value.trim()

  };

}


/* =========================
   VALIDATION
========================= */

function validateData(data){

  if(!data.name){
    alert("Owner Name डालें");
    nameInput.focus();
    return false;
  }

  if(!data.mobile){
    alert("Mobile Number डालें");
    mobileInput.focus();
    return false;
  }

  if(!/^[0-9]{10}$/.test(data.mobile)){
    alert("Mobile Number 10 digit होना चाहिए");
    mobileInput.focus();
    return false;
  }

  if(!data.city){
    alert("City डालें");
    cityInput.focus();
    return false;
  }

  if(!data.address){
    alert("Address डालें");
    addressInput.focus();
    return false;
  }

  if(!data.type){
    alert("Property Type select करें");
    typeInput.focus();
    return false;
  }

  if(!data.rent || data.rent <= 0){
    alert("Monthly Rent डालें");
    rentInput.focus();
    return false;
  }

  return true;

}


/* =========================
   POST / UPDATE ROOM
========================= */

postButton.addEventListener("click", async function(){

  const data = getFormData();

  if(!validateData(data)){
    return;
  }

  postButton.disabled = true;

  try{

    if(editingId){

      showStatus("Room update हो रहा है...");

      data.updatedAt = serverTimestamp();

      await updateDoc(
        doc(db,ROOM_COLLECTION,editingId),
        data
      );

      showStatus("Room successfully update हो गया ✅");

    }
    else{

      showStatus("Room Firebase में save हो रहा है...");

      data.createdAt = serverTimestamp();
      data.updatedAt = serverTimestamp();

      await addDoc(
        collection(db,ROOM_COLLECTION),
        data
      );

      showStatus("Room successfully post हो गया ✅");

    }

    resetForm();

    await loadRooms();

  }
  catch(error){

    console.error("Firebase Error:",error);

    showStatus(
      "Save नहीं हुआ: " + error.message,
      "error"
    );

  }
  finally{

    postButton.disabled = false;

  }

});


/* =========================
   LOAD ROOMS
========================= */

async function loadRooms(){

  roomsContainer.innerHTML =
    '<div class="loading">Rooms load हो रहे हैं...</div>';

  try{

    const snapshot =
      await getDocs(
        collection(db,ROOM_COLLECTION)
      );

    const rooms = [];

    snapshot.forEach(item=>{

      rooms.push({
        id:item.id,
        ...item.data()
      });

    });

    rooms.sort((a,b)=>{

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });

    displayRooms(rooms);

  }
  catch(error){

    console.error("Load Error:",error);

    roomsContainer.innerHTML = `
      <div class="empty">
        <h3>Rooms load नहीं हो पाए</h3>
        <p>${escapeHTML(error.message)}</p>
        <br>
        <button class="btn btn-blue" onclick="window.loadRoomsAgain()">
          Retry
        </button>
      </div>
    `;

    roomCount.textContent = "Room count उपलब्ध नहीं";

  }

}


/* =========================
   DISPLAY ROOMS
========================= */

function displayRooms(rooms){

  const city =
    searchCity.value.trim().toLowerCase();

  const type =
    searchType.value;

  const filtered = rooms.filter(room=>{

    const roomCity =
      String(room.city || "").toLowerCase();

    const roomAddress =
      String(room.address || "").toLowerCase();

    const cityMatch =
      !city ||
      roomCity.includes(city) ||
      roomAddress.includes(city);

    const typeMatch =
      !type ||
      room.type === type;

    return cityMatch && typeMatch;

  });


  roomCount.textContent =
    `कुल ${filtered.length} room मिले`;


  if(filtered.length === 0){

    roomsContainer.innerHTML = `
      <div class="empty">
        <h3>कोई room नहीं मिला</h3>
        <p>Search बदलकर फिर कोशिश करें।</p>
      </div>
    `;

    return;

  }


  roomsContainer.innerHTML =
    filtered.map(room=>{

      const image =
        room.image || FALLBACK_IMAGE;

      const rent =
        Number(room.rent || 0).toLocaleString("en-IN");

      return `

        <div class="room-card">

          <img
            class="room-image"
            src="${escapeHTML(image)}"
            alt="Room"
            onerror="this.src='${FALLBACK_IMAGE}'"
          >

          <div class="room-body">

            <div class="room-title">
              ${escapeHTML(room.type || "Property")}
            </div>

            <div class="rent">
              ₹${rent}/month
            </div>

            <div class="info">
              👤 <b>Owner:</b>
              ${escapeHTML(room.name || "-")}
            </div>

            <div class="info">
              📱 <b>Mobile:</b>
              ${escapeHTML(room.mobile || "-")}
            </div>

            <div class="info">
              📍 <b>City:</b>
              ${escapeHTML(room.city || "-")}
            </div>

            <div class="info">
              🏠 <b>Address:</b>
              ${escapeHTML(room.address || "-")}
            </div>

            <div class="info">
              🛋️ <b>Furnishing:</b>
              ${escapeHTML(room.furnishing || "-")}
            </div>

            ${
              room.description
              ?
              `<div class="description">
                ${escapeHTML(room.description)}
              </div>`
              :
              ""
            }

            <div class="card-buttons">

              <button
                class="btn btn-green"
                onclick="window.contactOwner('${escapeHTML(room.mobile || "")}')">
                📞 Contact
              </button>

              <button
                class="btn btn-blue"
                onclick="window.editRoom('${room.id}')">
                ✏️ Edit
              </button>

              <button
                class="btn btn-red"
                onclick="window.deleteRoom('${room.id}')">
                🗑️ Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

searchCity.addEventListener(
  "input",
  loadRooms
);

searchType.addEventListener(
  "change",
  loadRooms
);


/* =========================
   CONTACT OWNER
========================= */

window.contactOwner = function(mobile){

  if(!mobile){
    alert("Mobile number available नहीं है।");
    return;
  }

  const ok =
    confirm(
      "क्या आप इस owner को call करना चाहते हैं?\n\n" +
      mobile
    );

  if(ok){

    window.location.href =
      "tel:" + mobile;

  }

};


/* =========================
   EDIT ROOM
========================= */

window.editRoom = async function(id){

  try{

    showStatus("Room data load हो रहा है...");

    const snapshot =
      await getDocs(
        collection(db,ROOM_COLLECTION)
      );

    let found = null;

    snapshot.forEach(item=>{

      if(item.id === id){

        found = {
          id:item.id,
          ...item.data()
        };

      }

    });


    if(!found){

      alert("Room नहीं मिला।");
      return;

    }


    editingId = id;

    nameInput.value =
      found.name || "";

    mobileInput.value =
      found.mobile || "";

    cityInput.value =
      found.city || "";

    addressInput.value =
      found.address || "";

    typeInput.value =
      found.type || "";

    furnishingInput.value =
      found.furnishing || "";

    rentInput.value =
      found.rent || "";

    descriptionInput.value =
      found.description || "";

    currentPhotoData =
      found.image || "";


    if(found.image){

      photoPreview.src =
        found.image;

      photoPreview.style.display =
        "block";

    }
    else{

      photoPreview.style.display =
        "none";

    }


    postButton.textContent =
      "Update Room";

    cancelButton.style.display =
      "inline-block";


    document.getElementById("post")
      .scrollIntoView({
        behavior:"smooth"
      });


    showStatus(
      "Edit mode चालू है। बदलाव करके Update Room दबाएँ।"
    );

  }
  catch(error){

    console.error(error);

    showStatus(
      "Edit नहीं हो पाया: " + error.message,
      "error"
    );

  }

};


/* =========================
   DELETE ROOM
========================= */

window.deleteRoom = async function(id){

  const ok =
    confirm(
      "क्या आप यह room delete करना चाहते हैं?"
    );

  if(!ok){
    return;
  }

  try{

    showStatus("Room delete हो रहा है...");

    await deleteDoc(
      doc(db,ROOM_COLLECTION,id)
    );

    showStatus("Room delete हो गया ✅");

    await loadRooms();

  }
  catch(error){

    console.error(error);

    showStatus(
      "Delete नहीं हुआ: " + error.message,
      "error"
    );

  }

};


/* =========================
   CANCEL EDIT
========================= */

cancelButton.addEventListener(
  "click",
  function(){

    resetForm();

    showStatus("Edit cancel कर दिया गया।");

  }
);

========================= */

  editingId = null;

  currentPhotoData = "";

  nameInput.value = "";
  mobileInput.value = "";
  cityInput.value = "";
  addressInput.value = "";
  typeInput.value = "";
  furnishingInput.value = "";
  rentInput.value = "";
  descriptionInput.value = "";

  imageInput.value = "";

  photoPreview.src = "";
  photoPreview.style.display = "none";

  postButton.textContent =
    "Post Room";

  cancelButton.style.display =
    "none";

}


/* =========================
   RETRY
========================= */

window.loadRoomsAgain = function(){

  loadRooms();

};


/* =========================
   START
========================= */

loadRooms();
